<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📜 Changelog</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#0b0d12;--panel:#151923;--text:#e8ebf2;--muted:#9aa3b5;--accent:#7fd6ff;--ok:#7be38b;--warn:#ffcc66;--bad:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 64px}
.menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.menu a{color:var(--accent);text-decoration:none;padding:7px 11px;border-radius:8px;background:var(--panel)}
.md h1{font-size:clamp(1.8rem,4vw,2.4rem);margin:12px 0 8px}
.md h2{margin:34px 0 12px;border-bottom:1px solid var(--panel);padding-bottom:6px}
.md h3{margin:24px 0 6px}
.md a{color:var(--accent)}
.md code{background:var(--panel);padding:1px 6px;border-radius:4px;font-size:.9em;word-break:break-word}
.md pre{background:var(--panel);padding:14px;border-radius:10px;overflow-x:auto;font-size:.85rem;line-height:1.35}
.md pre code{background:none;padding:0}
.md table{width:100%;border-collapse:collapse;font-size:.92rem;margin:12px 0;display:block;overflow-x:auto}
.md th,.md td{padding:8px;border-bottom:1px solid var(--panel);text-align:left;vertical-align:top}
.md th{color:var(--accent)}
.md blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:4px 14px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--panel);margin:24px 0}
.md li{margin:4px 0}
.fallback{background:var(--panel);border-radius:12px;padding:16px;color:var(--warn)}
</style>
</head>
<body>
<main>
<nav class="menu" aria-label="Site menu">
  <a href="../index.html">🏠 Home</a>
  <a href="architecture.html">🏗️ Architecture</a>
  <a href="changelog.html">📜 Changelog</a>
  <a href="storyboard.html">🎞️ Storyboard</a>
  <a href="report.html">📋 Report</a>
  <a href="https://claude.ai/artifact/C34ZR7eo5Gt3utaiFZ5Fwn">🧩 Architecture board</a>
</nav>
<article id="content" class="md"><p>⏳ Loading CHANGELOG.md …</p></article>
<div id="fallback" class="fallback" hidden>
  ⚠️ This page could not load its Markdown source. Open the raw file: <a href="https://github.com/rifaterdemsahin/blender-memory-palaces/blob/main/memory-palace/CHANGELOG.md">CHANGELOG.md on GitHub</a>.
</div>
</main>
<script>
// Renders CHANGELOG.md with marked, sanitised by DOMPurify. Relative links resolve from this folder.
(function () {
  fetch("CHANGELOG.md", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (md) {
      var html = marked.parse(md, { gfm: true, breaks: false });
      document.getElementById("content").innerHTML = DOMPurify.sanitize(html);
      document.title = (document.querySelector("#content h1") || {}).textContent || document.title;
    })
    .catch(function () {
      document.getElementById("content").hidden = true;
      document.getElementById("fallback").hidden = false;
    });
})();
</script>
</body>
</html>
